name: Build AyuGram Desktop (Windows FIXED)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # =========================
      # HARD SUBMODULE FIX (КЛЮЧЕВОЕ)
      # =========================
      - name: Fix submodules (CRITICAL)
        shell: cmd
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -xfd

      # =========================
      # MSVC
      # =========================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # =========================
      # CMAKE + NINJA
      # =========================
      - name: Install build tools
        run: |
          choco install cmake ninja -y

      # =========================
      # QT6 (ОБЯЗАТЕЛЬНО)
      # =========================
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.1
          arch: win64_msvc2019_64
          modules: qt5compat

      # =========================
      # DEBUG (проверка ada)
      # =========================
      - name: Check ada exists
        shell: cmd
        run: |
          dir Telegram\cmake\external\ada

      # =========================
      # CONFIGURE
      # =========================
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja" ^
            -DCMAKE_PREFIX_PATH=%Qt6_DIR% ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      # =========================
      # BUILD
      # =========================
      - name: Build
        shell: cmd
        run: |
          cmake --build build --target Telegram -- -j 4

      # =========================
      # ARTIFACT
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows
          path: build/Telegram.exe
          if-no-files-found: error
