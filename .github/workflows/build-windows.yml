name: Build AyuGram Desktop (Windows FULL FIX)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      # =========================
      # CHECKOUT (ВАЖНО)
      # =========================
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Hard reset submodules
        shell: cmd
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -xfd

      # =========================
      # MSVC
      # =========================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # =========================
      # CMAKE + NINJA
      # =========================
      - name: Install tools
        run: |
          choco install ninja cmake -y

      # =========================
      # VCPKG (CRITICAL FIX FOR DEPENDENCIES)
      # =========================
      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          C:\vcpkg\bootstrap-vcpkg.bat

      # =========================
      # QT6
      # =========================
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.1
          arch: win64_msvc2019_64
          modules: qt5compat

      # =========================
      # VULKAN SDK (FIX YOUR ERROR)
      # =========================
      - name: Install Vulkan SDK
        shell: powershell
        run: |
          choco install vulkan-sdk -y

      # =========================
      # ENV SETUP
      # =========================
      - name: Setup environment
        shell: cmd
        run: |
          set VULKAN_SDK=C:\VulkanSDK\1.3.290.0
          set CMAKE_PREFIX_PATH=%Qt6_DIR%

      # =========================
      # CONFIGURE
      # =========================
      - name: Configure project
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja" ^
            -DCMAKE_TOOLCHAIN_FILE=C:\vcpkg\scripts\buildsystems\vcpkg.cmake ^
            -DCMAKE_PREFIX_PATH=%Qt6_DIR% ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      # =========================
      # BUILD
      # =========================
      - name: Build
        shell: cmd
        run: |
          cmake --build build --target Telegram -- -j 4

      # =========================
      # ARTIFACT
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-FULL
          path: build/Telegram.exe
          if-no-files-found: error
