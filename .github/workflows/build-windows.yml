name: Build AyuGram Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare and Configure
        shell: cmd
        run: |
          :: Navigate to the prepare directory
          cd Telegram\build\prepare
          
          :: Run win.bat. 
          :: Note: If it still fails, we 'call' it to keep variables in the current session
          call win.bat
          
          cd ..\..
          
          :: Now run the configure script
          :: Using ^ for line breaks in CMD
          call configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Release
        shell: cmd
        run: |
          cd out
          cmake --build . --config Release --target Telegram -j 2
