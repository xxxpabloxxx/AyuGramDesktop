name: Build AyuGram Desktop (GitHub Actions)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (v143)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Prepare build (win.bat)
        shell: cmd
        run: |
          cd Telegram\build\prepare
          call win.bat

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build
        shell: cmd
        run: |
          cd Telegram\out
          cmake --build . --config Release --target Telegram -- /maxcpucount:4 /verbosity:minimal /nologo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-EXE
          path: Telegram/out/Release/Telegram.exe
          if-no-files-found: error
