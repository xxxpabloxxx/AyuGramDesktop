name: Build AyuGram Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # =========================
      # ИСПРАВЛЕННЫЙ FIX SUBMODULES для AyuGram
      # =========================
      - name: Fix submodules (CRITICAL for AyuGram)
        shell: cmd
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --force --depth=1
          git submodule foreach --recursive git reset --hard
          git submodule foreach --recursive git clean -xfd

      # =========================
      # Проверка структуры (для отладки)
      # =========================
      - name: Check project structure
        shell: cmd
        run: |
          echo "=== Root directories ==="
          dir
          echo "=== cmake directory ==="
          dir cmake
          echo "=== Telegram/cmake (if exists) ==="
          dir Telegram\cmake 2>nul || echo "Telegram/cmake not found"
          echo "=== ThirdParty ==="
          dir Telegram\ThirdParty

      # =========================
      # MSVC
      # =========================
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      # =========================
      # CMake + Ninja
      # =========================
      - name: Install build tools
        run: |
          choco install cmake ninja -y

      # =========================
      # Qt 6.6.1
      # =========================
      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.6.1
          arch: win64_msvc2019_64
          modules: qt5compat

      # =========================
      # Configure
      # =========================
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B build -G "Ninja" ^
            -DCMAKE_PREFIX_PATH=%Qt6_DIR% ^
            -DCMAKE_BUILD_TYPE=RelWithDebInfo ^
            -DTDESKTOP_API_ID=2040 ^
            -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 ^
            -DDESKTOP_APP_USE_PACKAGED=OFF

      # =========================
      # Build
      # =========================
      - name: Build
        shell: cmd
        run: |
          cmake --build build --target Telegram --config RelWithDebInfo -- -j %NUMBER_OF_PROCESSORS%

      # =========================
      # Artifact
      # =========================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Desktop-Windows
          path: build/Telegram.exe
          if-no-files-found: error
