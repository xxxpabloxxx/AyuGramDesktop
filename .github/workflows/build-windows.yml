name: Build AyuGram Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-2022

    env:
      NUMBER_OF_PROCESSORS: 2

    steps:
      # 📥 Клонирование
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🐍 Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⚙️ Установка зависимостей (КРИТИЧНО)
      - name: Install dependencies (Perl + NASM)
        shell: powershell
        run: |
          choco install strawberryperl -y
          choco install nasm -y

      # 💣 ВСЁ В ОДНОМ ШАГЕ (чтобы не терялось окружение)
      - name: Full Build (MSVC + Prepare + Build)
        shell: cmd
        run: |
          echo ============================
          echo FINDING VISUAL STUDIO
          echo ============================

          IF EXIST "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ) ELSE IF EXIST "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            call "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) ELSE (
            call "C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          )

          echo ============================
          echo MSVC CHECK
          echo ============================

          where cl
          cl

          echo ============================
          echo PREPARE (win.bat)
          echo ============================

          cd Telegram\build\prepare
          call win.bat

          echo ============================
          echo CONFIGURE
          echo ============================

          cd ..\..\..
          cd Telegram

          configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

          echo ============================
          echo BUILD
          echo ============================

          cd ..\out
          cmake --build . --config Release --target Telegram -- /maxcpucount:2

      # 📦 Артефакт
      - name: Upload AyuGram.exe
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Release
          path: out/Release/Telegram.exe
          if-no-files-found: error
