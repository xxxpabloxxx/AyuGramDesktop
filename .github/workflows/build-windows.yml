name: Build AyuGram Windows

on:
  workflow_dispatch:
  push:
    branches:
      - plugin-loader-work

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Самый надёжный способ инициализации окружения VS 2022
      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          # toolset удалён специально — чтобы избежать ошибки "Toolset directory for version '143' was not found"

      # Альтернатива (если ilammy снова упадёт) — раскомментируй и закомментируй верхний шаг:
      # - name: Setup MSVC Environment manually
      #   shell: cmd
      #   run: |
      #     call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
      #     echo MSVC environment initialized successfully

      - name: Prepare dependencies (Telegram libraries, Qt, vcpkg и т.д.)
        shell: cmd
        run: |
          Telegram\build\prepare\win.bat

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build Debug
        shell: cmd
        run: |
          msbuild out\Telegram.sln ^
            /p:Configuration=Debug ^
            /p:Platform=x64 ^
            /m ^
            /verbosity:normal

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Debug
          path: out\Debug\*
          retention-days: 7
