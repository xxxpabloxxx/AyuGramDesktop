name: Build AyuGram Desktop (Windows)

on:
  workflow_dispatch:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

jobs:
  build:
    runs-on: windows-2022

    steps:
      # 📥 Клонирование
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🐍 Python (нужен для скриптов Telegram)
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ⚙️ PREPARE (главный фикс)
      - name: Prepare build environment
        shell: cmd
        run: |
          echo ============================
          echo LOCATING VISUAL STUDIO
          echo ============================

          IF EXIST "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" (
            set VCVARS="C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          ) ELSE IF EXIST "C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat" (
            set VCVARS="C:\Program Files\Microsoft Visual Studio\2022\Professional\VC\Auxiliary\Build\vcvars64.bat"
          ) ELSE (
            set VCVARS="C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          )

          echo Using: %VCVARS%

          call %VCVARS%

          echo ============================
          echo MSVC CHECK
          echo ============================

          where cl
          cl

          echo ============================
          echo RUNNING win.bat
          echo ============================

          cd Telegram\build\prepare
          call win.bat

      # 🔧 CONFIGURE
      - name: Configure CMake
        shell: cmd
        run: |
          call %VCVARS%

          cd Telegram
          configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      # 🏗 BUILD
      - name: Build Release
        shell: cmd
        run: |
          call %VCVARS%

          cd out
          cmake --build . --config Release --target Telegram -- /maxcpucount

      # 📦 ARTIFACT
      - name: Upload AyuGram.exe
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Release
          path: out/Release/Telegram.exe
          if-no-files-found: error
