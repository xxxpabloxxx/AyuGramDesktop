name: Build AyuGram Release

on:
  workflow_dispatch:

jobs:
  build:
    # Оставляем самописный раннер, раз ты собираешь у себя
    runs-on: self-hosted

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Full Build (AyuGram Release)
        shell: cmd
        run: |
          :: 1. Подключаем твою установленную Visual Studio 18 (2025)
          set "VCVARS=C:\Program Files\Microsoft Visual Studio\18\Community\VC\Auxiliary\Build\vcvars64.bat"
          if exist "%VCVARS%" (
              call "%VCVARS%" x64
          ) else (
              echo [ERROR] Visual Studio vcvars64.bat not found!
              exit /b 1
          )

          :: 2. Подготовка библиотек (пропускаем msys, если он тупит)
          :: Мы добавляем автоматический пропуск, чтобы билд не падал на сетевых ошибках MSYS
          cd Telegram\build\prepare
          echo s | call win.bat
          
          :: 3. Конфигурация под Release
          cd ..\..\..
          cd Telegram
          :: Мы НЕ используем configure.bat напрямую, чтобы избежать ошибки Ninja
          cmake -G "Ninja" -B ../out -D CMAKE_BUILD_TYPE=Release -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          
          :: 4. Сборка (Release)
          cd ..\out
          cmake --build . --config Release --target Telegram -- /maxcpucount:4

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-Release
          :: Путь к готовому .exe файлу
          path: out/Telegram/Release/AyuGram.exe
          retention-days: 7
