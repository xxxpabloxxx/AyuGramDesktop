name: Build AyuGram Desktop (GitHub Actions)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC (v143)
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Setup build directory
        shell: cmd
        run: |
          cd Telegram
          if not exist out mkdir out

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          cmake -S . -B out -G "NMake Makefiles" ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build
        shell: cmd
        run: |
          cmake --build Telegram\out --config Release --target Telegram -- /maxcpucount:4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-EXE
          path: Telegram/out/Telegram.exe
          if-no-files-found: error
