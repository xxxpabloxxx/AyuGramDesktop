name: Build AyuGram Desktop (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Full Build (AyuGram)
        shell: cmd
        run: |
          :: 1. Инициализация через прямой путь (VS 2022 Community)
          :: Если у тебя версия Pro или Enterprise, поменяй Community на свою в пути ниже
          set "VCVARS=C:\Program Files\Microsoft Visual Studio\2022\Community\VC\Auxiliary\Build\vcvars64.bat"
          
          if exist "%VCVARS%" (
              call "%VCVARS%"
          ) else (
              echo [ERROR] vcvars64.bat NOT FOUND at %VCVARS%
              exit /b 1
          )

          :: 2. Подготовка (win.bat)
          cd Telegram\build\prepare
          call win.bat

          :: 3. Конфигурация
          cd ..\..\..
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

          :: 4. Сборка
          cd ..\out
          cmake --build . --config Release --target Telegram -- /maxcpucount:4 /verbosity:minimal /nologo

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-EXE
          path: out/Release/Telegram.exe
          if-no-files-found: error
          
