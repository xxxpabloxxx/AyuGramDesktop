name: Build AyuGram Desktop (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    # Обязательно указываем твой личный раннер
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Full Build (AyuGram)
        shell: cmd
        run: |
          :: 1. Инициализация переменных окружения MSVC 2022
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          if exist "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" (
            call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" >nul
          )

          :: 2. Подготовка зависимостей (самый долгий шаг в первый раз)
          :: Это скачивает и компилирует библиотеки из гайда (Qt, OpenSSL и др.)
          cd Telegram\build\prepare
          call win.bat

          :: 3. Конфигурация проекта с твоими API ключами
          cd ..\..\..
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

          :: 4. Финальная компиляция
          :: Ставим /maxcpucount:4, чтобы комп не задохнулся, но собирал шустро
          cd ..\out
          cmake --build . --config Release --target Telegram -- /maxcpucount:4 /verbosity:minimal /nologo

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-EXE
          path: out/Release/Telegram.exe
          if-no-files-found: error
