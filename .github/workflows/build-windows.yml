name: Build AyuGram Windows

on:
  workflow_dispatch:
  push:
    branches:
      - plugin-loader-work

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022

    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Prepare dependencies
        shell: cmd
        run: |
          Telegram\build\prepare\win.bat

      - name: Configure project
        shell: cmd
        run: |
          cd Telegram
          configure.bat x64 ^
            -D TDESKTOP_API_ID=2040 ^
            -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

      - name: Build
        shell: cmd
        run: |
          msbuild out\Telegram.sln ^
            /p:Configuration=${{ matrix.configuration }} ^
            /p:Platform=x64 ^
            /m ^
            /verbosity:normal

      - name: Prepare ZIP
        shell: powershell
        run: |
          $config = "${{ matrix.configuration }}"
          $zip = "AyuGram-Windows-$config.zip"

          if (Test-Path "out") {
            Compress-Archive -Path "out\*" -DestinationPath $zip -Force
          }

      - name: Upload artifact (Actions tab)
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-${{ matrix.configuration }}
          path: AyuGram-Windows-${{ matrix.configuration }}.zip

      # 🔥 RELEASE ONLY FOR Release BUILD
      - name: Create GitHub Release
        if: matrix.configuration == 'Release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AyuGram build ${{ github.run_number }}
          files: AyuGram-Windows-Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
