name: Build AyuGram Desktop (Self-Hosted)

on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Full Build (AyuGram)
        shell: cmd
        run: |
          :: 1. Инициализация переменных окружения MSVC 2022 (С ИСПРАВЛЕННЫМИ КАВЫЧКАМИ)
          for /f "usebackq tokens=*" %%i in (`"C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do set "VS_PATH=%%i"
          
          :: Проверяем путь и вызываем vcvars64 в кавычках
          if exist "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" (
            call "%VS_PATH%\VC\Auxiliary\Build\vcvars64.bat" x64 >nul
          ) else (
            echo [ERROR] Visual Studio vcvars64.bat not found! && exit /b 1
          )

          :: 2. Подготовка зависимостей (win.bat)
          cd Telegram\build\prepare
          call win.bat

          :: 3. Конфигурация проекта
          cd ..\..\..
          cd Telegram
          call configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627

          :: 4. Финальная компиляция
          cd ..\out
          cmake --build . --config Release --target Telegram -- /maxcpucount:4 /verbosity:minimal /nologo

      - name: Upload Result
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-EXE
          path: out/Release/Telegram.exe
          if-no-files-found: error
          
