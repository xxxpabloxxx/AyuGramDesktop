name: Build AyuGram

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      # 📥 Клонируем с сабмодулями
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 🐍 Python (некоторые скрипты требуют)
      - name: Setup Python
        uses: actions/setup-python@v5

      # 🧰 Зависимости
      - name: Install dependencies
        run: |
          choco install strawberryperl nasm -y

      # ⚙️ Указываем Qt (ВАЖНО)
      - name: Set Qt path
        run: |
          echo "CMAKE_PREFIX_PATH=D:/a/AyuGramDesktop/AyuGramDesktop/Libraries/win64/qt_5.15.18" >> $env:GITHUB_ENV

      # 🏗️ Конфигурируем
      - name: Configure
        run: |
          cmake -S . -B out -DCMAKE_BUILD_TYPE=Release

      # 🔨 Билдим
      - name: Build
        run: |
          cmake --build out --config Release --parallel

      # 🔍 Ищем любой .exe
      - name: Find EXE
        id: find_exe
        shell: powershell
        run: |
          $exe = Get-ChildItem -Path . -Recurse -Filter *.exe | Select-Object -First 1
          if (-not $exe) {
            Write-Error "No exe found"
            exit 1
          }
          echo "exe_path=$($exe.FullName)" >> $env:GITHUB_OUTPUT
          echo "Found EXE: $($exe.FullName)"

      # 📦 Загружаем артефакт
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: build-exe
          path: ${{ steps.find_exe.outputs.exe_path }}
